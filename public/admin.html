<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebtopKids — ניהול</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.6rem 0.8rem; border: 1px solid var(--border, #333); text-align: right; }
    th { background: var(--surface-1, #1a1a1a); }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; }
    .badge-active { background: #1a4a1a; color: #4ade80; }
    .badge-pending { background: #4a3a00; color: #fbbf24; }
    .badge-disabled { background: #3a1a1a; color: #f87171; }
    button { padding: 4px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; }
    .btn-approve { background: #166534; color: #fff; }
    .btn-disable { background: #7f1d1d; color: #fff; }
    h2 { margin-bottom: 0.5rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h2>לוח ניהול WebtopKids</h2>
  <p class="subtitle">ניהול הורים + אישור חיבורי Token</p>
  <div id="content">טוען...</div>
  <script>
    const token = localStorage.getItem('wt_token');
    if (!token) location.replace('/login');

    async function api(method, path, body) {
      const r = await fetch(path, {
        method,
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      if (r.status === 401 || r.status === 403) { location.replace('/login'); return null; }
      return r.json();
    }

    async function loadUsers() {
      const users = await api('GET', '/api/admin/users');
      if (!users) return;
      const rows = users.map(u => `
        <tr>
          <td>${u.name}</td>
          <td>${u.phone}</td>
          <td><span class="badge badge-${u.status}">${u.status}</span></td>
          <td>${u.lastLogin ? new Date(u.lastLogin).toLocaleString('he-IL') : '—'}</td>
          <td>${u.lastLoginIp || '—'}</td>
          <td>${u.loginCount || 0}</td>
          <td>${u.hasPendingToken ? '⏳ ממתין' : (u.tokenUpdatedAt ? '✅' : '—')}</td>
          <td>
            ${u.hasPendingToken ? `<button class="btn-approve" onclick="approveToken('${u.id}')">אשר Token</button> ` : ''}
            ${u.status === 'active' ? `<button class="btn-disable" onclick="disableUser('${u.id}')">בטל גישה</button>` : ''}
          </td>
        </tr>
      `).join('');
      document.getElementById('content').innerHTML = `
        <table>
          <thead><tr><th>שם</th><th>טלפון</th><th>סטטוס</th><th>כניסה אחרונה</th><th>IP</th><th>כניסות</th><th>Token</th><th>פעולות</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function approveToken(id) {
      await api('POST', `/api/admin/users/${id}/approve-token`);
      loadUsers();
    }

    async function disableUser(id) {
      if (!confirm('לבטל גישה למשתמש זה?')) return;
      await api('POST', `/api/admin/users/${id}/disable`);
      loadUsers();
    }

    loadUsers();
  </script>
</body>
</html>

  <ol>

    <li>
      גרור את הכפתור הבא לסרגל הסימניות:<br><br>
      <a class="bookmarklet" href="javascript:(function(){var t=document.cookie.split(';').map(function(c){return c.trim();}).find(function(c){return c.startsWith('webToken=');});if(!t){alert('\u05dc\u05d0 \u05e0\u05de\u05e6\u05d0 webToken \u2014 \u05d5\u05d3\u05d0 \u05e9\u05d0\u05ea\u05d4 \u05d1-Webtop \u05d5\u05de\u05d7\u05d5\u05d1\u05e8');return;}var phone=prompt('\u05de\u05e1\u05e4\u05e8 \u05d4\u05d8\u05dc\u05e4\u05d5\u05df \u05e9\u05dc\u05da (\u05dc\u05e6\u05d5\u05e8\u05da \u05d6\u05d9\u05d4\u05d5\u05d9):');if(!phone)return;fetch('https://webtop.egautomations.cloud/api/token-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t.split('=').slice(1).join('='),phone:phone})}).then(function(r){return r.json();}).then(function(d){alert(d.message||'\u05e0\u05e9\u05dc\u05d7!');}).catch(function(){alert('\u05e9\u05d2\u05d9\u05d0\u05ea \u05e8\u05e9\u05ea \u2014 \u05e0\u05e1\u05d4 \u05e9\u05d5\u05d1');});})()">📎 שלח Token ל-WebtopKids</a>
